name: CI

# ZTech Lead Generation - continuous integration.
#
# Added in F0 (audit gap G-06). Before this workflow existed there was NO CI in
# any ZTech repository: the 115+ test files, the dependency posture, the
# migration behaviour and the Windows packaging were all verified by hand.
#
# The suite is dependency-free by design, so CI adds no toolchain: it installs
# from the lockfile, runs the same runner a developer runs, and gates on the
# same checks.
#
# No step in this workflow contacts a paid provider, sends mail, or triggers
# outreach. The provider integrations are exercised against fakes.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` installs exactly what the lockfile pins. Before F0 the committed
      # lockfile was out of sync with package.json and `npm ci` FAILED with 32
      # missing entries - see audit gap G-08. This step is the canary.
      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Repository hygiene check
        run: npm run check:repo

      # Incremental ESLint (audit gap G-07). The error tier is what the
      # codebase already satisfies, so it must stay at 0. The warning tier is
      # visible debt; it is reported and its count is printed, but it does not
      # fail the build.
      #
      # It is a Node script rather than a shell pipeline: a shell redirection
      # into a JSON file is not portable (PowerShell writes UTF-16, which
      # JSON.parse rejects) and the failure then looks like a lint error.
      - name: Lint
        run: node scripts/lint-report.js

      - name: Test suite
        run: npm test

      - name: Production dependency audit
        run: npm run audit:prod

  contract:
    name: zuni-seo contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The research contract is owned by the separate zuni-seo product. ZTech
      # vendors it so it can validate a real envelope offline; this job proves
      # the vendored copy is still identical to the source. The zuni-seo
      # repository is READ ONLY here - it is never modified.
      #
      # The zuni-seo repository is private, so the job's own GITHUB_TOKEN
      # cannot read it. A token with access (ZUNI_SEO_READ_TOKEN) turns the
      # comparison on; without it the job reports that it could not run, and
      # the ALWAYS-ON gate - the SHA-256 manifest test in
      # tests/lead-intelligence/zuniseo-envelope.test.js - still proves the
      # vendored files are unmodified.
      - name: Check out zuni-seo (read only)
        id: zuniseo
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: z-sops/zuni-seo
          ref: feature/geo-growth-intelligence
          path: zuni-seo
          token: ${{ secrets.ZUNI_SEO_READ_TOKEN }}

      - name: The vendored contract is identical to zuni-seo
        if: steps.zuniseo.outcome == 'success'
        run: node scripts/sync-zuniseo-contract.js --from zuni-seo --check

      - name: The cross-repository comparison needs a token for the private zuni-seo repository
        if: steps.zuniseo.outcome != 'success'
        run: |
          echo "::notice::zuni-seo could not be checked out: the repository is private and this job has no token for it."
          echo "::notice::Add the ZUNI_SEO_READ_TOKEN secret to turn the cross-repository comparison on."
          echo "::notice::The always-on gate is tests/lead-intelligence/zuniseo-envelope.test.js, which verifies the vendored contract and fixtures against their recorded SHA-256 manifest."

  package:
    name: windows package smoke test
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The directory package is used because the default target needs Windows
      # symlink privileges that a CI runner does not have; see README.md and
      # audit gap G-15.
      - name: Build (directory package)
        run: npm run build:win
      - name: The artifact exists and contains the renderer
        shell: pwsh
        run: |
          $unpacked = 'dist\win-unpacked'
          if (-not (Test-Path $unpacked)) { throw "no build output in $unpacked" }
          $exe = Get-ChildItem $unpacked -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'no executable was produced' }
          Write-Host "artifact: $($exe.Name) $([math]::Round($exe.Length/1MB,1))MB"
