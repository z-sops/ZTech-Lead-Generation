<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZTech Lead Generation</title>
  <link rel="stylesheet" href="./src/renderer/styles.css">
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="app-layout">
    <!-- Left sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="brand">ZTech Lead Generation</h1>
        <span class="version">v1.0.0</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="collector">
          <span class="nav-icon">🔍</span>
          <span class="nav-label">Keyword Collection</span>
        </button>
        <button class="nav-item" data-view="history">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Collection History</span>
        </button>
        <button class="nav-item" data-view="numbers">
          <span class="nav-icon">📋</span>
          <span class="nav-label">Lead Management</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Settings</span>
        </button>
      </nav>
    </aside>

    <!-- Main content area -->
    <main class="main-content">
      <!-- Top status bar -->
      <header class="top-bar">
        <div class="top-bar-title" id="page-title">Keyword Collection</div>
        <div class="top-bar-stats">
          <span class="stat-item">Collected: <strong id="stat-collected">0</strong></span>
        </div>
        <div class="top-bar-time" id="clock"></div>
      </header>

      <!-- 视图容器 -->
      <div class="view-container">
        <!-- Collection view -->
        <section class="view active" id="view-collector">
          <div class="view-top">
            <div class="form-item">
              <label>Keywords</label>
              <input type="text" id="collect-keywords" placeholder="多个用逗号分隔，如: HVAC Contractors, Plumber">
            </div>
            <div class="form-item">
              <label>Region</label>
              <input type="text" id="collect-region" placeholder="如: New York,USA">
            </div>
            <div class="form-item">
              <label>Language</label>
              <select id="collect-lang">
                <option value="en">English</option>
                <option value="zh">Chinese</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="ar">العربية</option>
                <option value="pt">Português</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
              </select>
            </div>
            <div class="form-item">
              <label>Maximum Quantity</label>
              <input type="number" id="collect-max" value="20" min="1" max="500">
            </div>
            <div class="form-item">
              <label>Title Matching</label>
              <select id="collect-title-match">
                <option value="all">Match All</option>
                <option value="exact">Exact Match</option>
                <option value="contains">包含Keywords</option>
              </select>
            </div>
            <div class="form-item">
              <label>Lowest Rating</label>
              <select id="collect-min-rating">
                <option value="all">Any</option>
                <option value="4.5">4.5+</option>
                <option value="4.0">4.0+</option>
                <option value="3.5">3.5+</option>
                <option value="3.0">3.0+</option>
              </select>
            </div>
            <div class="form-item">
              <label>Website Filter</label>
              <select id="collect-website-filter">
                <option value="all">All</option>
                <option value="has_website">Has Website</option>
                <option value="no_website">No Website</option>
              </select>
            </div>

            <div class="form-divider"></div>
            <div class="switch-grid">
              <label class="switch-label"><input type="checkbox" id="collect-skip-closed" checked> Skip Permanently Closed</label>
              <label class="switch-label"><input type="checkbox" id="collect-social" checked> Social Information</label>
              <label class="switch-label"><input type="checkbox" id="collect-facebook"> Facebook</label>
              <label class="switch-label"><input type="checkbox" id="collect-instagram"> Instagram</label>
              <label class="switch-label"><input type="checkbox" id="collect-youtube"> YouTube</label>
              <label class="switch-label"><input type="checkbox" id="collect-tiktok"> TikTok</label>
              <label class="switch-label"><input type="checkbox" id="collect-linkedin"> LinkedIn</label>
              <label class="switch-label"><input type="checkbox" id="collect-place-details"> Detailed Information</label>
              <label class="switch-label"><input type="checkbox" id="collect-reservation"> Booking Information</label>
              <label class="switch-label"><input type="checkbox" id="collect-online-order"> Online Ordering</label>
              <label class="switch-label"><input type="checkbox" id="collect-web-result"> Web Search</label>
              <label class="switch-label"><input type="checkbox" id="collect-email-verify"> Email Verification</label>
              <label class="switch-label"><input type="checkbox" id="collect-reviews"> Scrape Reviews</label>
              <label class="switch-label"><input type="checkbox" id="collect-reviewer-info"> Reviewer Information</label>
              <label class="switch-label"><input type="checkbox" id="collect-mobile-only"> <span style="color:red;font-weight:bold;">Mobile Numbers Only</span></label>
            </div>

            <div class="form-divider"></div>
            <div class="form-item">
              <label>Max Reviews per Business</label>
              <input type="number" id="collect-max-reviews" value="5" min="1" max="50">
            </div>
            <div class="form-item">
              <label>Review Sort</label>
              <select id="collect-review-sort">
                <option value="newest">Newest</option>
                <option value="highest">Highest Rating</option>
                <option value="lowest">Lowest Rating</option>
                <option value="most_relevant">Most Relevant</option>
              </select>
            </div>
            <div class="form-item">
              <label>评论Keywords</label>
              <input type="text" id="collect-review-keyword" placeholder="筛选包含Keywords的评论">
            </div>

            <div class="form-actions">
              <button class="btn btn-primary" id="btn-start-collect">Start Collection</button>
              <button class="btn btn-secondary" id="btn-check-status">Check Status</button>
            </div>
            <div class="status-bar" id="collect-status" style="display:none;"></div>

            <div id="collect-result-card" style="display:none; margin-top:16px;">
              <div class="form-divider"></div>
              <div style="display:flex; align-items:center; justify-content:space-between; margin:10px 0;">
                <strong style="font-size:13px;">Collection Results</strong>
                <div style="display:flex; gap:8px;">
                  <button class="btn btn-sm btn-primary" id="btn-save-numbers">Save to Lead Library</button>
                  <button class="btn btn-sm" id="btn-export-results">Export CSV</button>
                </div>
              </div>
              <table class="data-table">
                <thead>
                  <tr>
                    <th><input type="checkbox" id="select-all-results"></th>
                    <th>Business Name</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Website</th>
                    <th>Email</th>
                  </tr>
                </thead>
                <tbody id="collect-result-body"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- Collection History视图 -->
        <section class="view" id="view-history">
          <div class="view-top">
            <div class="form-actions">
              <button class="btn btn-secondary" id="btn-refresh-history">Refresh Records</button>
            </div>
          </div>
          <div class="view-bottom">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Worker</th>
                  <th>Status</th>
                  <th>Results</th>
                  <th>Cost ($)</th>
                  <th>Duration</th>
                  <th>Source</th>
                  <th>Time</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="history-table-body"></tbody>
            </table>
            <div class="pagination" id="history-pagination"></div>
          </div>
        </section>

        <!-- Lead Management视图 -->
        <section class="view" id="view-numbers">
          <div class="view-top">
            <div class="form-item">
              <label>Search</label>
              <input type="text" id="number-search" placeholder="输入PhoneSearch...">
            </div>
            <div class="form-item">
              <label>Status筛选</label>
              <select id="number-filter-status">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="sent">Sent</option>
                <option value="success">Success</option>
                <option value="failed">Failed</option>
              </select>
            </div>
            <div class="form-actions">
              <button class="btn btn-sm" id="btn-import-numbers">Import Leads</button>
              <button class="btn btn-sm" id="btn-export-csv">Export CSV</button>
              <button class="btn btn-sm btn-danger" id="btn-delete-selected">Delete Selected</button>
            </div>
          </div>
          <div class="view-bottom">
            <table class="data-table">
              <thead>
                <tr>
                  <th><input type="checkbox" id="select-all-numbers"></th>
                  <th>Phone</th>
                  <th>Source</th>
                  <th>Keywords</th>
                  <th>Status</th>
                  <th>采集Time</th>
                </tr>
              </thead>
              <tbody id="numbers-table-body"></tbody>
            </table>
            <div class="pagination" id="numbers-pagination"></div>
          </div>
        </section>

        <!-- Settings视图 -->
        <section class="view" id="view-settings">
          <div class="view-top">
            <div class="form-item">
              <label>CoreClaw API Key</label>
              <div class="input-with-btn">
                <input type="password" id="settings-apikey" placeholder="如: scraper_api_xxxxx">
                <button class="btn btn-secondary btn-sm" id="btn-test-apikey">Test Connection</button>
              </div>
            </div>
            <div class="form-item">
              <label>Task Flow Key</label>
              <div class="input-with-btn">
                <input type="text" id="settings-task-key" placeholder="如: 01KWA7xxxx">
                <button class="btn btn-secondary btn-sm" id="btn-test-taskkey">Test Connection</button>
              </div>
            </div>
            <div class="form-item">
              <label>Network Proxy</label>
              <div class="input-with-btn">
                <input type="text" id="settings-proxy-url" placeholder="如: http://127.0.0.1:7890 或留空Auto Detect">
                <button class="btn btn-secondary btn-sm" id="btn-detect-proxy">Auto Detect</button>
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-primary" id="btn-save-settings">保存Settings</button>
              <button class="btn btn-secondary" id="btn-export-logs">Export Logs</button>
            </div>
          </div>
          <div class="view-bottom"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="./src/renderer/renderer.js"></script>
</body>
</html>
